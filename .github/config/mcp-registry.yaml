# mcp-registry.yaml
# Pluggable list of MCPs the FEV agent knows about. Sourced from live wikis (see
# AGENTS.md for the page references). To register a new MCP, append an entry here.

mcps:

  - id: hsdes
    display: "Intel HSD MCP (mcp-hsd)"
    reference: "https://github.com/intel-sandbox/mcp-suite/tree/master/tools/mcp-hsd"
    upstream_alternative: "https://wiki.ith.intel.com/spaces/ITScedf/pages/4705390469/HSDES+MCP (62-tool wheel — not the one installed here)"
    primary_for: [HSD-Analyst]
    # VS Code registers this server as `hsdes` in .vscode/mcp.json. Tool names become
    # mcp_hsdes_<server_function>.
    tool_prefix: "mcp_hsdes_"
    server_name: "mcp-hsd"
    total_tools: 13
    transport: "stdio"
    install: |
      # Already installed in this workspace at:
      #   third_party/mcp-suite/tools/mcp-hsd/server.py
      # Launched by .vscode/mcp.json via .venv/bin/python.
      # To refresh:
      #   git -C third_party/mcp-suite pull
      #   .venv/bin/pip install -r third_party/mcp-suite/tools/mcp-hsd/requirements.txt
      # Prerequisite: valid Kerberos TGT (`kinit <idsid>@AMR.CORP.INTEL.COM` or run kinit_hsd.sh).

    # Verified tool surface (server.py @mcp.tool decorators).
    tools:
      - name: mcp_hsdes_get_hsd_article
        what: "Fetch an HSD article by numeric ID. Optional `fields` filter."
        example: 'mcp_hsdes_get_hsd_article(article_id="14027842487")'
      - name: mcp_hsdes_get_hsd_article_with_comments
        what: "Fetch an HSD article including comment thread."
        example: 'mcp_hsdes_get_hsd_article_with_comments(article_id="14027842487")'
      - name: mcp_hsdes_get_hsd_article_full
        what: "Fetch article + comments + optionally download all attachments."
        example: 'mcp_hsdes_get_hsd_article_full(article_id="14027842487", download_attachments=true)'
      - name: mcp_hsdes_get_hsd_article_images
        what: "Pull all images embedded in the article (and comments if requested)."
        example: 'mcp_hsdes_get_hsd_article_images(article_id="14027842487")'
      - name: mcp_hsdes_summarize_hsd_article
        what: "Server-side concise summary of an HSD article."
        example: 'mcp_hsdes_summarize_hsd_article(article_id="14027842487")'
      - name: mcp_hsdes_download_hsd_attachments
        what: "Download attachments from an HSD into HSD_DOWNLOAD_DIR."
        example: 'mcp_hsdes_download_hsd_attachments(article_id="14027842487")'
      - name: mcp_hsdes_search_hsd
        what: "Keyword / field search over HSDES."
        example: 'mcp_hsdes_search_hsd(query="fev_rtl2syn non-equivalent", limit=20)'
      - name: mcp_hsdes_run_saved_hsd_query
        what: "Execute a saved HSDES query by query ID."
        example: 'mcp_hsdes_run_saved_hsd_query(query_id="16012345678")'
      - name: mcp_hsdes_download_hsd_url
        what: "Download a file from an authenticated HSDES URL."
        example: 'mcp_hsdes_download_hsd_url(url="https://hsdes.intel.com/...")'
      # Built-in AI skills (in-server, no separate publish step needed).
      - name: mcp_hsdes_skill_extract_fields
        what: "AI: extract canonical fields from an article."
      - name: mcp_hsdes_skill_summarize
        what: "AI: narrative summary of an article."
      - name: mcp_hsdes_skill_classify
        what: "AI: classify article (type/severity/domain)."
      - name: mcp_hsdes_skill_root_cause
        what: "AI: propose a root-cause hypothesis from article + comments."

    example_prompts:
      - { task: "Look up a ticket",      example: 'Summarize HSDES ticket 14027842487' }
      - { task: "Search tickets",        example: 'Search HSDES for fev_rtl2syn non-equivalent in last 90 days' }
      - { task: "Run saved query",       example: 'Run HSDES query 16012345678' }
      - { task: "Find similar issues",   example: 'Find tickets similar to 14027842487' }
      - { task: "Download attachments",  example: 'Download all attachments from HSD 14027842487' }
      - { task: "Extract fields (AI)",   example: 'Use skill_extract_fields on HSD 14027842487' }
      - { task: "Classify (AI)",         example: 'Classify HSD 14027842487' }
      - { task: "Root-cause hint (AI)",  example: 'Propose a root cause for HSD 14027842487' }

    # The in-server AI skills above ARE the only "bundled skills"; the wiki's wheel-only skills
    # (hsdes-issue-investigator, hsdes-quality-scorer, hsdes-query-eql, hsdes-orchestrator,
    # hsdes-issue-manager, hsdes-debug-orchestrator) are NOT available in mcp-hsd. Project-local
    # skills under .github/skills/hsd-* fill the equivalent role.
    bundled_skills:
      - { id: skill_extract_fields, tool: mcp_hsdes_skill_extract_fields, what: "Extract canonical HSD fields." }
      - { id: skill_summarize,      tool: mcp_hsdes_skill_summarize,      what: "Narrative summary." }
      - { id: skill_classify,       tool: mcp_hsdes_skill_classify,       what: "Type / severity / domain classification." }
      - { id: skill_root_cause,     tool: mcp_hsdes_skill_root_cause,     what: "Root-cause hypothesis." }

    auth:
      type: kerberos
      realm: "AMR.CORP.INTEL.COM"
      refresh: "kinit <idsid>@AMR.CORP.INTEL.COM   # or run third_party/mcp-suite/tools/mcp-hsd/kinit_hsd.sh"

    notes: |
      Tools are deferred — load with `tool_search query="hsd article fetch search download"` before
      calling. All callable surface lives under the `mcp_hsdes_*` prefix because the server is
      registered as `hsdes` in .vscode/mcp.json. The server itself names itself `mcp-hsd` —
      ignore that label when calling tools.

      Always normalize the input HSD ID to its trailing numeric run before any call (the agent
      docs codify this — see hsd-analyst.agent.md "HSD ID normalization rule").

  - id: wiki-jira
    display: "Intel wiki-jira MCP"
    reference: "Confluence (wiki.ith.intel.com) + Intel Jira via the wiki-jira-mcp server"
    primary_for: [Jira-Wiki-Researcher]
    tool_prefix: "mcp_wiki-jira-mcp_"

    default_spaces:
      # Default Confluence search scope used by this workspace's wiki-jira MCP config.
      - { key: oksdebug,    purpose: "Platform SysDebug handbook (not FEV-primary)." }
      - { key: fvcommon,    purpose: "FVCommon — reset/PythonSV BKMs (not FEV-primary)." }
      - { key: SIPGSLD,     purpose: "SIPG System Level Debug (not FEV-primary)." }
      - { key: XPIVSHCoVal, purpose: "Team DPMO/GNR space (not FEV-primary)." }

    fev_scope:
      # Spaces the FEV agent should add to every Confluence search.
      - key: cheetah
        display: "Cheetah / FEV root"
        root_url: "https://wiki.ith.intel.com/display/cheetah/FEV"
        root_page_id: "2288898439"

    # Verified tool names exposed by the wiki-jira MCP in this workspace.
    tools:
      - name: mcp_wiki-jira-mcp_confluence_search
        what: "Search Confluence in default spaces (or override via spaces_filter)."
        example: 'confluence_search query="FEV blackbox modeling BKM" spaces_filter="cheetah"'
      - name: mcp_wiki-jira-mcp_confluence_get_page
        what: "Fetch a Confluence page by ID or by (space_key, title)."
        example: 'confluence_get_page page_id="2288898439"'
      - name: mcp_wiki-jira-mcp_confluence_get_page_children
        what: "List/inspect children of a page; can include rendered content."
        example: 'confluence_get_page_children parent_id="2376013930" include_content=true'
      - name: mcp_wiki-jira-mcp_confluence_get_space_page_tree
        what: "Flat hierarchy of an entire space — useful for orientation."
        example: 'confluence_get_space_page_tree space_key="cheetah" limit=200'
      - name: mcp_wiki-jira-mcp_confluence_get_comments
        what: "Comments on a page."
        example: 'confluence_get_comments page_id="2288898444"'
      - name: mcp_wiki-jira-mcp_confluence_get_page_history
        what: "Fetch an older version of a page."
        example: 'confluence_get_page_history page_id="..." version=3'
      - name: mcp_wiki-jira-mcp_confluence_get_page_diff
        what: "Unified diff between two versions of a page (useful for BKM changes)."
        example: 'confluence_get_page_diff page_id="..." from_version=10 to_version=11'
      - name: mcp_wiki-jira-mcp_confluence_get_attachments
        what: "List attachments on a page."
      - name: mcp_wiki-jira-mcp_confluence_download_attachment
        what: "Download one attachment by ID."
      - name: mcp_wiki-jira-mcp_confluence_download_content_attachments
        what: "Download all attachments on a page."
      - name: mcp_wiki-jira-mcp_confluence_get_page_images
        what: "Fetch embedded images on a page."
      - name: mcp_wiki-jira-mcp_confluence_get_labels
        what: "Page labels (use to filter BKM-tagged pages)."

    widen_phrases:
      - "search all spaces"
      - "search the whole wiki"
    widen_action: 'set spaces_filter="" on confluence_search'


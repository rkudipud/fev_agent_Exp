  # ==========================================================================
  # Maintenance contract — how this index is kept fresh.
  # ==========================================================================
  maintenance:
    owners: ["@Jira-Wiki-Researcher", "@FEV-Lead"]
    refresh_cadence: "every release cycle, or when a `last_seen_version` drifts more than 5 versions behind live."
    refresh_procedure:
      - "Run `mcp_wiki-jira-mcp_confluence_get_page_children(parent_id=<root>)` for each subtree."
      - "Diff returned `version` against `last_seen_version` field; bump and update `last_updated`."
      - "Add new child pages to the corresponding `*_subtree.children` list."
      - "If a `highly_ranked` page is deprecated upstream, move it to `curated_pages` with a `deprecated: true` tag, do NOT delete (Jira-Wiki-Researcher cites history)."
    add_a_page:
      - "Append to `curated_pages` with title/page_id/url/tags/(tool)/summary."
      - "If it is a sub-page of FEV/FEV_CONFORMAL/FEV_FORMALITY, also append to the matching `*_subtree.children`."
      - "If it should jump to top-of-mind, add a row to `highly_ranked` with rank and `why`."

